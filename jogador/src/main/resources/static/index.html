<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cadastro de jogador da NBA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#e9edf3; --surface:#ffffff; --ink:#14213d; --muted:#5b6682; --line:#cbd3e1;
  --accent:#d9480f; --accent-ink:#ffffff; --danger:#b42318; --field:#f5f7fb; --ok:#1a7f4b;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e1526; --surface:#16203a; --ink:#edf0f7; --muted:#9aa5c3; --line:#2b3857;
    --accent:#ff7a33; --accent-ink:#1a0e05; --danger:#ff8a80; --field:#0f1830; --ok:#5fd38d;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1526; --surface:#16203a; --ink:#edf0f7; --muted:#9aa5c3; --line:#2b3857;
  --accent:#ff7a33; --accent-ink:#1a0e05; --danger:#ff8a80; --field:#0f1830; --ok:#5fd38d;
}
html{height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Barlow",system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:32px 20px 56px}
h1{font:800 clamp(2.2rem,8vw,3.2rem)/.95 "Barlow Condensed",Impact,sans-serif;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px}
label{display:block;font-weight:600;font-size:.9rem;margin:0 0 4px}
.field{margin-bottom:14px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
fieldset{border:0;padding:0;margin:0 0 4px}
legend{font-weight:600;font-size:.9rem;padding:0;margin-bottom:4px}
.err{color:var(--danger);min-height:1.4em;margin:0 0 10px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{font:600 1rem "Barlow",sans-serif;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:11px 18px;border-radius:8px;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ok{margin-top:18px;border:1px solid var(--ok);border-radius:12px;padding:16px 20px;background:var(--surface)}
.ok[hidden]{display:none}
.ok h2{margin:0 0 8px;font:700 1.5rem "Barlow Condensed",sans-serif;color:var(--ok)}
.ok dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 14px}
.ok dt{color:var(--muted)} .ok dd{margin:0;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <h1>Cadastro de jogador da NBA</h1>
  <p class="sub">Preencha os dados do jogador. Os campos com * são obrigatórios.</p>

  <form class="panel" id="form" novalidate>
    <div class="field"><label for="nome">Nome completo *</label><input id="nome" maxlength="60" autocomplete="off"></div>
    <div class="row">
      <div class="field"><label for="numero">Número da camisa *</label><input id="numero" type="number" min="0" max="99"></div>
      <div class="field"><label for="posicao">Posição *</label>
        <select id="posicao">
          <option value="">Escolha</option>
          <option>Armador (PG)</option>
          <option>Ala-armador (SG)</option>
          <option>Ala (SF)</option>
          <option>Ala-pivô (PF)</option>
          <option>Pivô (C)</option>
        </select>
      </div>
    </div>
    <div class="field"><label for="time">Time *</label><select id="time"><option value="">Escolha um time</option></select></div>
    <div class="row3">
      <div class="field"><label for="idade">Idade</label><input id="idade" type="number" min="17" max="50"></div>
      <div class="field"><label for="altura">Altura (cm)</label><input id="altura" type="number" min="150" max="240"></div>
      <div class="field"><label for="peso">Peso (kg)</label><input id="peso" type="number" min="60" max="200"></div>
    </div>
    <div class="field"><label for="pais">País de origem</label><input id="pais" maxlength="40" autocomplete="off"></div>
    <fieldset>
      <legend>Médias por jogo</legend>
      <div class="row3">
        <div class="field"><input id="pts" type="number" step="0.1" min="0" max="60" placeholder="Pontos" aria-label="Pontos por jogo"></div>
        <div class="field"><input id="reb" type="number" step="0.1" min="0" max="30" placeholder="Rebotes" aria-label="Rebotes por jogo"></div>
        <div class="field"><input id="ast" type="number" step="0.1" min="0" max="25" placeholder="Assistências" aria-label="Assistências por jogo"></div>
      </div>
    </fieldset>
    <p class="err" id="erro" role="alert"></p>
    <div class="actions">
      <button class="btn primary" type="submit">Cadastrar jogador</button>
      <button class="btn" type="reset" id="limpar">Limpar</button>
    </div>
  </form>

  <section class="ok" id="ok" hidden aria-live="polite">
    <h2>Jogador cadastrado</h2>
    <dl id="resumo"></dl>
  </section>
</div>

<script>
(function(){
  var TIMES=["Atlanta Hawks","Boston Celtics","Brooklyn Nets","Charlotte Hornets","Chicago Bulls","Cleveland Cavaliers","Dallas Mavericks","Denver Nuggets","Detroit Pistons","Golden State Warriors","Houston Rockets","Indiana Pacers","Los Angeles Clippers","Los Angeles Lakers","Memphis Grizzlies","Miami Heat","Milwaukee Bucks","Minnesota Timberwolves","New Orleans Pelicans","New York Knicks","Oklahoma City Thunder","Orlando Magic","Philadelphia 76ers","Phoenix Suns","Portland Trail Blazers","Sacramento Kings","San Antonio Spurs","Toronto Raptors","Utah Jazz","Washington Wizards"];
  var $=function(id){return document.getElementById(id)};
  TIMES.forEach(function(t){var o=document.createElement("option");o.value=t;o.textContent=t;$("time").appendChild(o)});

  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}

  $("form").addEventListener("submit",function(e){
    e.preventDefault();
    var nome=$("nome").value.trim(), n=$("numero").value, pos=$("posicao").value, time=$("time").value, erro="";
    if(nome.length<3) erro="Informe o nome completo do jogador.";
    else if(n===""||!/^\d{1,2}$/.test(n)) erro="O número da camisa deve ser um inteiro de 0 a 99.";
    else if(!pos) erro="Escolha a posição do jogador.";
    else if(!time) erro="Escolha o time do jogador.";
    $("erro").textContent=erro;
    if(erro) return;

    var campos=[["Nome",nome],["Camisa",n],["Posição",pos],["Time",time],
      ["Idade",$("idade").value&&$("idade").value+" anos"],
      ["Altura",$("altura").value&&$("altura").value+" cm"],
      ["Peso",$("peso").value&&$("peso").value+" kg"],
      ["País",$("pais").value.trim()],
      ["Pontos",$("pts").value],["Rebotes",$("reb").value],["Assistências",$("ast").value]];
    $("resumo").innerHTML=campos.filter(function(c){return c[1]!==""&&c[1]!=null})
      .map(function(c){return "<dt>"+c[0]+"</dt><dd>"+esc(c[1])+"</dd>"}).join("");
    $("ok").hidden=false;
    $("ok").scrollIntoView({behavior:"smooth",block:"nearest"});
    $("form").reset();
    $("nome").focus();
  });

  $("limpar").addEventListener("click",function(){$("erro").textContent="";$("ok").hidden=true});
})();
</script>
</body>
</html>
